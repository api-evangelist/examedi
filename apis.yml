aid: examedi
name: Examedi
description: Examedi is a Latin American healthtech company providing at-home medical
  and laboratory testing. Patients book online and a healthcare professional visits
  their home to collect samples (blood, urine, PCR and more), with results delivered
  digitally through the company's app and website. Examedi operates in Chile
  (examedi.cl) and Mexico (examedi.mx) and runs a live authenticated application
  backend at api.examedi.com. The company is backed by General Catalyst. No public
  developer program, API documentation, or OpenAPI definition is published at this
  time; this profile records the company's identity and discovered surfaces for the
  API Evangelist network.
